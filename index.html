<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulando Objetos em JavaScript</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="card">
            <h1><i class="fas fa-user-edit"></i> Manipulando Objetos</h1>
            <div class="input-group">
                <label for="nomeInput"><i class="fas fa-user"></i> Nome:</label>
                <input type="text" id="nomeInput" placeholder="Ex: João Silva">
            </div>
            <div class="input-group">
                <label for="idadeInput"><i class="fas fa-birthday-cake"></i> Idade:</label>
                <input type="number" id="idadeInput" placeholder="Ex: 25">
            </div>
            <div class="input-group">
                <label for="profissaoInput"><i class="fas fa-briefcase"></i> Profissão:</label>
                <input type="text" id="profissaoInput" placeholder="Ex: Desenvolvedor">
            </div>
            <div class="button-group">
                <button id="buttonAdicionar" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Adicionar
                </button>
                <button id="buttonConsultar" class="btn btn-success">
                    <i class="fas fa-search"></i> Consultar
                </button>
                <button id="buttonAlterar" class="btn btn-warning">
                    <i class="fas fa-edit"></i> Alterar
                </button>
                <button id="buttonExcluir" class="btn btn-danger">
                    <i class="fas fa-trash"></i> Excluir
                </button>
            </div>

            <div id="info" class="info-container"></div>
        </div>
        <div class="floating-icons">
            <div class="icon-circle"><i class="fas fa-code"></i></div>
            <div class="icon-circle"><i class="fas fa-object-group"></i></div>
            <div class="icon-circle"><i class="fas fa-database"></i></div>
        </div>
        <script src="main.js"></script>
    </div>
</body>

</html>
